name: ci

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.filter.outputs.report }}
      check: ${{ steps.filter.outputs.check }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            report:
              - 'report/**'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yaml'
            check:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/packages/**'
              - '.github/workflows/ci.yaml'
            docs:
              - 'src/**'
              - '.github/workflows/ci.yaml'

  check:
    needs: changes
    if: ${{ needs.changes.outputs.check == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://cache.lukasl.dev/"
          cache: cartppole
          token: "${{ secrets.CACHE_SECRET }}"

      - name: Check 
        run: nix run .#check --accept-flake-config

  report:
    needs: changes
    if: ${{ needs.changes.outputs.report == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://cache.lukasl.dev/"
          cache: cartppole
          token: "${{ secrets.CACHE_SECRET }}"

      - name: Build report
        run: nix build .#report --accept-flake-config

      - uses: actions/upload-artifact@v5
        with:
          name: report
          path: result/report.pdf

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: ryanccn/attic-action@v0
        with:
          endpoint: "https://cache.lukasl.dev/"
          cache: cartppole
          token: "${{ secrets.CACHE_SECRET }}"

      - name: Build docs
        run: nix build .#docs --accept-flake-config

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: result

      - uses: actions/deploy-pages@v4
        id: deployment
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
